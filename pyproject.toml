[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-failure-hunter"
version = "0.2.0"
description = "Adversarial search for radar CFAR detector failure scenarios, with report and web app"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["radar_hunter"]
